```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - ATM System</title>

    <style>
        *{box-sizing:border-box;margin:0;padding:0}

        body{
            min-height:100vh;
            font-family:Arial,sans-serif;
            background:
                radial-gradient(circle at top left,#164e8a,transparent 35%),
                radial-gradient(circle at bottom right,#061b36,transparent 40%),
                linear-gradient(135deg,#020817,#08264a);
            color:white;
            padding:25px;
        }

        .container{
            width:92%;
            max-width:600px;
            margin:50px auto;
        }

        .top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
        }

        .back{
            color:#93c5fd;
            text-decoration:none;
        }

        .card{
            padding:32px;
            border-radius:24px;
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.15);
            backdrop-filter:blur(18px);
            box-shadow:0 25px 60px rgba(0,0,0,.4);
        }

        h1{margin-bottom:8px}

        .subtitle{
            color:#9eb9d8;
            margin-bottom:28px;
        }

        .balance{
            padding:18px;
            margin-bottom:25px;
            border-radius:15px;
            background:rgba(37,99,235,.18);
            border:1px solid rgba(96,165,250,.2);
        }

        .balance small{
            display:block;
            color:#9eb9d8;
            margin-bottom:7px;
        }

        .balance strong{font-size:25px}

        label{
            display:block;
            margin-bottom:9px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:15px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,.16);
            background:rgba(0,0,0,.22);
            color:white;
            font-size:17px;
            outline:none;
            margin-bottom:20px;
        }

        input:focus{border-color:#60a5fa}

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:linear-gradient(135deg,#1473e6,#0b4fa8);
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        .messages{margin-bottom:20px}

        .message{
            padding:12px;
            border-radius:10px;
            background:rgba(239,68,68,.15);
            color:#fecaca;
            margin-bottom:7px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <h2>💸 Withdraw</h2>

        <a href="{% url 'user_dashboard' %}" class="back">
            ← Dashboard
        </a>
    </div>

    <div class="card">

        <h1>Withdraw Money</h1>

        <p class="subtitle">
            Withdraw money from your ATM account.
        </p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="balance">
            <small>Available Balance</small>
            <strong>{{ account.balance|floatformat:2 }}</strong>
        </div>

        <form method="POST">

            {% csrf_token %}

            <label for="amount">Amount</label>

            <input
                type="number"
                id="amount"
                name="amount"
                min="1"
                step="0.01"
                placeholder="Enter amount"
                required
            >

            <button type="submit">
                CONFIRM WITHDRAWAL
            </button>

        </form>

    </div>

</div>

</body>
</html>
```
