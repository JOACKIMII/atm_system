<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Customer Account</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #001f3f,
                    #0066cc
                );

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .box {
            width: 450px;

            max-width: 92%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, .3);
        }

        h1 {
            color: #003b73;

            text-align: center;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 15px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-top: 7px;

            border:
                1px solid #ccc;

            border-radius: 9px;

            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #0066cc;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #008f5a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #0066cc;

            text-decoration: none;
        }

        .error {
            background: #ffe5e5;

            color: #c00000;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;
        }

        .success {
            background: #e1f7ec;

            color: #087443;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;
        }

    </style>

</head>


<body>


<div class="box">

    <h1>
        🏦 Add Customer
    </h1>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    {% if success %}

        <div class="success">
            {{ success }}
        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>
            Account Number
        </label>

        <input
            type="text"
            name="account_number"
            placeholder="Example: 10101011"
            required
        >


        <label>
            Customer Full Name
        </label>

        <input
            type="text"
            name="full_name"
            placeholder="Customer full name"
            required
        >


        <label>
            PIN
        </label>

        <input
            type="password"
            name="pin"
            placeholder="4 - 6 digit PIN"
            maxlength="6"
            required
        >


        <label>
            Initial Balance
        </label>

        <input
            type="number"
            name="balance"
            placeholder="0"
            min="0"
            step="0.01"
            value="0"
            required
        >


        <button type="submit">
            CREATE CUSTOMER ACCOUNT
        </button>

    </form>


    <a
        href="{% url 'bank_admin_dashboard' %}"
        class="back"
    >
        ← Back to Admin Dashboard
    </a>

</div>


</body>

</html>
