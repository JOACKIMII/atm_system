<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bank Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #001f3f,
                    #0066cc,
                    #00a8ff
                );
        }

        .login-box {
            width: 400px;

            padding: 40px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.3);

            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;

            margin: auto;
            margin-bottom: 20px;

            border-radius: 50%;

            background: #0066cc;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
        }

        h1 {
            color: #003b73;
            margin-bottom: 5px;
        }

        p {
            color: #777;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #0066cc;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #004c99;
        }

        .error {
            margin-top: 15px;

            padding: 12px;

            background: #ffe5e5;

            color: #c00000;

            border-radius: 8px;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <div class="icon">
            🏦
        </div>

        <h1>Bank Admin</h1>

        <p>Administrator Secure Login</p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Admin Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Admin Password"
                required
            >

            <button type="submit">
                LOGIN TO BANK
            </button>

        </form>

    </div>

</body>

</html>
